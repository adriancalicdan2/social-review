<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0814" />
      <stop offset="50%" stop-color="#181130" />
      <stop offset="100%" stop-color="#0e0a1f" />
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a37bf7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#1bdfcf" />
    </linearGradient>

    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a37bf7" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#1bdfcf" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a0814" stop-opacity="0" />
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Ambient Glow Backdrop -->
  <circle cx="256" cy="256" r="220" fill="url(#auraGlow)" />

  <!-- Outer Cyber Tech Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#neonGrad)" stroke-width="6" stroke-dasharray="24 12 8 12" opacity="0.6" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#a37bf7" stroke-width="2" opacity="0.4" />

  <!-- Stylized Geometric "A" Monogram with Cyber Aesthetics -->
  <g filter="url(#glowFilter)">
    <!-- Left Leg -->
    <path d="M 256 100 L 140 380 L 185 380 L 256 200 Z" fill="url(#neonGrad)" />
    <!-- Right Leg -->
    <path d="M 256 100 L 372 380 L 327 380 L 256 200 Z" fill="url(#neonGrad)" opacity="0.95" />
    <!-- Horizontal Crossbar Accent -->
    <path d="M 190 300 L 322 300 L 312 330 L 200 330 Z" fill="#1bdfcf" opacity="0.9" />
    <!-- Center Core Diamond -->
    <polygon points="256,150 270,180 256,210 242,180" fill="#ffffff" />
  </g>

  <!-- Tiny Corner Accent Nodes -->
  <circle cx="140" cy="380" r="8" fill="#1bdfcf" />
  <circle cx="372" cy="380" r="8" fill="#a37bf7" />
  <circle cx="256" cy="100" r="8" fill="#ffffff" />
</svg>
